# =====================================================================
#  Database connection settings  (loaded by com.onlineexam.util.DBConnection)
# =====================================================================
#  EDIT THESE to match YOUR local MySQL before running the app.
#  - db.user / db.password must be a MySQL account that can access the
#    'online_exam' schema you create from database/schema.sql.
#  - The URL flags avoid the two most common MySQL 8 connection errors
#    (SSL warning + public-key-retrieval).
#
#  NOTE: this file is listed in .gitignore so your real password is not
#  pushed to GitHub. A committed template lives in db.properties.example.
# =====================================================================

db.url=jdbc:mysql://localhost:3306/online_exam?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=password
